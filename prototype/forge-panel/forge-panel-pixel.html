      { id: 'rift', name: '裂地', fullName: '裂地法印', label: '范围', bonus: 12 },
      { id: 'echo', name: '余震', fullName: '余震法印', label: '削韧', bonus: 25 },
    ]
  }
};

let state = null;
let hitBoxes = [];

function createInitialState() {
  return {
    tab: 'sword',
    inspectId: 'iron',
    colorChannel: 'primary',
    swordColors: { primary: 2, secondary: 0, accent: 1 },
    confirmSmelt: null,
    notice: '欢迎来到锻造台：可升级武器、熔铸进阶或精炼时印',
    ore: 14,
    sand: 6,
    slots: {
      sword: { equipped: 'iron',  imprint: 'edge',    levels: { iron: 3 },  ranks: { edge: 2, reach: 1, impact: 1 }, failures: { edge: 1, reach: 0, impact: 0 } },
      bow:   { equipped: 'field', imprint: 'feather', levels: { field: 2 }, ranks: { feather: 1, awl: 1, anchor: 1 }, failures: { feather: 0, awl: 0, anchor: 0 } },
      time:  { equipped: 'clock', imprint: 'rift',    levels: { clock: 2 }, ranks: { rift: 2, echo: 1 },             failures: { rift: 0, echo: 0 } },
    }
  };
}

function resetSave() {
  state = createInitialState();
  render();
}
function addMats(o, s) {
  state.ore += o; state.sand += s;
  state.notice = `已补充材料：强化矿 +${o}，淬炼砂 +${s}`;
  render();
}
function unlockAll() {
  state.ore = Math.max(state.ore, 30);
  state.sand = Math.max(state.sand, 20);
  state.slots.sword.levels = { iron: 3, warden: 3, wing: 2 };
  state.slots.bow.levels = { field: 2, silver: 2, thorn: 2 };
  state.notice = '已解锁全部 7 把武器，点击左上阶位槽即可自由切换或升级';
  render();
}

const canvas = document.getElementById('forge-canvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const maxW = window.innerWidth - 32;
  const maxH = window.innerHeight - 100;
  let scale = Math.floor(Math.min(maxW / 640, maxH / 360));
  if (scale < 1) scale = Math.min(maxW / 640, maxH / 360);
  canvas.style.width = Math.floor(640 * scale) + 'px';
  canvas.style.height = Math.floor(360 * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);

function snap(v) { return Math.floor(v / 2) * 2; }

function pbox(x, y, w, h, fill, border='#aa6630', inner='#0e121e', rivet=true) {
  x = snap(x); y = snap(y); w = snap(w); h = snap(h);
  ctx.fillStyle = '#0e121e'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = border;    ctx.fillRect(x+2, y+2, w-4, h-4);
  ctx.fillStyle = inner;     ctx.fillRect(x+4, y+4, w-8, h-8);
  ctx.fillStyle = fill;      ctx.fillRect(x+6, y+6, w-12, h-12);
  // 2x2 切角
  ctx.fillStyle = '#0a0e16';
  ctx.fillRect(x, y, 2, 2); ctx.fillRect(x+w-2, y, 2, 2);
  ctx.fillRect(x, y+h-2, 2, 2); ctx.fillRect(x+w-2, y+h-2, 2, 2);
  if (rivet && w >= 48 && h >= 36) {
    const pts = [[x+6, y+6], [x+w-10, y+6], [x+6, y+h-10], [x+w-10, y+h-10]];
    for (const [rx, ry] of pts) {
      ctx.fillStyle = '#966828'; ctx.fillRect(rx, ry, 4, 4);
      ctx.fillStyle = '#ffe596'; ctx.fillRect(rx, ry, 2, 2);
    }
  }
}

function drawImg2x(key, x, y) {
  const im = IMAGES[key];
  if (!im) return;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(im, snap(x), snap(y), im.width * 2, im.height * 2);
}

function drawText(txt, x, y, size=12, color='#ecdaac', align='left', boxW=0, shadow=true) {
  ctx.font = `${size}px ArkPixel12, monospace`;
  ctx.textBaseline = 'top';
  let dx = x;
  if (align !== 'left' && boxW > 0) {
    const m = ctx.measureText(txt).width;
    if (align === 'center') dx = x + Math.floor((boxW - m) / 2);
    else if (align === 'right') dx = x + boxW - Math.ceil(m);
  }
  dx = Math.round(dx); y = Math.round(y);
  if (shadow) {
    ctx.fillStyle = '#0e121e';
    ctx.fillText(txt, dx + 1, y + 1);
  }
  ctx.fillStyle = color;
  ctx.fillText(txt, dx, y);
}

function addHit(x, y, w, h, fn) {
  hitBoxes.push({ x, y, w, h, fn });
}

function render() {
  if (!state) return;
  hitBoxes = [];
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, 640, 360);

  // 1. 大面板外框 (640x360)
  pbox(0, 0, 640, 360, '#162230', '#966828', '#0e121e', true);

  // 2. 顶部栏 Header
  drawText('锻造台', 18, 8, 24, '#ffe596');
  drawText('320×180 PX', 96, 20, 12, '#9db3c2');

  let tx = 168;
  for (const cls of CATALOG.classes) {
    const active = state.tab === cls;
    const bw = 82;
    pbox(tx, 10, bw, 30, active ? '#223444' : '#121a26', active ? '#e0b253' : '#683a1c', '#0e121e', false);
    drawText(CATALOG.classLabels[cls], tx, 19, 12, active ? '#ffe596' : '#9db3c2', 'center', bw);
    const cCopy = cls;
    addHit(tx, 10, bw, 30, () => {
      state.tab = cCopy;
      state.inspectId = state.slots[cCopy].equipped;
      state.confirmSmelt = null;
      render();
    });
    tx += bw + 6;
  }

  // 矿 & 砂 & 关闭
  pbox(434, 10, 74, 30, '#121a26', '#683a1c', '#0e121e', false);
  drawImg2x('mat_ore_16', 440, 9);
  drawText(`矿 ${String(state.ore).padStart(2,'0')}`, 470, 19, 12, '#ffe596');

  pbox(514, 10, 74, 30, '#121a26', '#683a1c', '#0e121e', false);
  drawImg2x('mat_sand_16', 520, 9);
  drawText(`砂 ${String(state.sand).padStart(2,'0')}`, 550, 19, 12, '#6eb8f5');

  pbox(594, 10, 30, 30, '#683a1c', '#e0b253', '#0e121e', false);
  drawText('×', 594, 8, 24, '#ecdaac', 'center', 30);
  addHit(594, 10, 30, 30, () => {
    state.notice = '（预览模式）在游戏中点击 × 或按 G / Esc 将关闭锻造台返回场景';
    render();
  });

  ctx.fillStyle = '#683a1c'; ctx.fillRect(14, 44, 612, 2);
  ctx.fillStyle = '#0e121e'; ctx.fillRect(14, 46, 612, 2);

  // 当前类别数据
  const cls = state.tab;
  const slot = state.slots[cls];
  const weapons = CATALOG.weapons[cls];
  const eqIdx = weapons.findIndex(w => w.id === slot.equipped);
  let insIdx = weapons.findIndex(w => w.id === state.inspectId);
  if (insIdx < 0) { insIdx = eqIdx; state.inspectId = weapons[insIdx].id; }
  const item = weapons[insIdx];
  const eqItem = weapons[eqIdx];
  const ownedLv = slot.levels[item.id] || 0;
  const eqLv = slot.levels[eqItem.id] || 1;

  // =========================================================================
  // 左栏 (X=16, Y=54, W=256)
  // =========================================================================
  const LX = 16, LY = 54, LW = 256;

  // 3.1 顶部同类武器阶位槽
  for (let i = 0; i < weapons.length; i++) {
    const w = weapons[i];
    const sx = LX + i * 86;
    const sy = LY;
    const isSel = w.id === item.id;
    const isEq = w.id === slot.equipped;
    const lv = slot.levels[w.id];
    const canCraft = !lv && i <= eqIdx + 1;
    const bcol = isSel ? '#ffe596' : (isEq ? '#e0b253' : (lv ? '#966828' : (canCraft ? '#6eb8f5' : '#344c5e')));
    pbox(sx, sy, 82, 82, isSel ? '#223444' : '#121a26', bcol, '#0e121e', false);
    drawImg2x(`wpn_${w.id}_22`, sx + 19, sy + 14);

    // 左上状态角标
    const tag = isEq ? '已装' : (lv ? '已造' : (canCraft ? '可造' : '未解'));
    ctx.fillStyle = isEq ? '#aa6630' : '#162230';
    ctx.fillRect(sx + 6, sy + 6, 28, 14);
    drawText(tag, sx + 6, sy + 7, 12, isEq ? '#ffe596' : (canCraft ? '#6eb8f5' : '#9db3c2'), 'center', 28);

    // 右下等级或矿耗
    const sub = lv ? `Lv.${lv}` : `${CATALOG.craftCost[i]}矿`;
    drawText(sub, sx + 44, sy + 44, 12, lv ? '#ffe596' : '#6eb8f5', 'right', 30);

    // 底部名称条
    ctx.fillStyle = isSel ? '#162230' : '#0e121e';
    ctx.fillRect(sx + 6, sy + 60, 70, 16);
    drawText(w.name, sx + 6, sy + 62, 12, lv ? '#ecdaac' : '#9db3c2', 'center', 70);

    addHit(sx, sy, 82, 82, () => {
      state.inspectId = w.id;
      state.confirmSmelt = null;
      render();
    });
  }
  if (weapons.length === 1) {
    // 法器唯一槽位右侧补充说明框
    pbox(LX + 86, LY, 170, 82, '#121a26', '#683a1c', '#0e121e', false);
    drawText('唯一共鸣法器', LX + 98, LY + 12, 12, '#e0b253');
    drawText('· 蓄力碎时高效破坏地形', LX + 98, LY + 32, 12, '#ecdaac');
    drawText('· 升级同步扩大碎时范围', LX + 98, LY + 50, 12, '#6eb8f5');
  }

  // 3.2 主视觉展示石龛 (高 148px)
  const SY = LY + 88;
  pbox(LX, SY, LW, 148, '#121a26', '#aa6630', '#0e121e', true);
  ctx.strokeStyle = '#223444'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(LX + 128, SY + 76, 46, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#344c5e';
  ctx.beginPath(); ctx.arc(LX + 128, SY + 76, 34, 0, Math.PI * 2); ctx.stroke();

  drawImg2x(`wpn_${item.id}_56`, LX + 72, SY + 22);
  const tierName = cls === 'time' ? '本命法器' : `${CATALOG.tiers[insIdx]} · ${cls === 'sword' ? '近战' : '远程'}`;
  drawText(tierName, LX + 14, SY + 12, 12, '#9db3c2');
  drawText(item.skill, LX + 148, SY + 12, 12, '#e0b253');

  drawText('等级', LX + 14, SY + 124, 12, '#9db3c2');
  const dispLv = ownedLv || 1;
  for (let s = 0; s < 5; s++) {
    const bx = LX + 46 + s * 16, by = SY + 124;
    ctx.fillStyle = '#0e121e'; ctx.fillRect(bx, by, 12, 12);
    ctx.fillStyle = (ownedLv && s < dispLv) ? '#ffe596' : '#162230';
    ctx.fillRect(bx + 2, by + 2, 8, 8);
  }
  drawText(ownedLv ? `Lv.${ownedLv} / 5` : '未打造', LX + 184, SY + 124, 12, ownedLv ? '#ffe596' : '#6eb8f5');

  // 3.3 底部配色条 (剑可调 3 通道，弓/法器显示机制说明)
  const CY = SY + 154;
  pbox(LX, CY, LW, 50, '#121a26', '#683a1c', '#0e121e', false);
  if (cls === 'sword') {
    drawText('配色', LX + 10, CY + 9, 12, '#9db3c2');
    const chs = [['primary', '主色', 42], ['secondary', '副色', 90], ['accent', '点缀', 138]];
    for (const [chKey, chName, cxOff] of chs) {
      const act = state.colorChannel === chKey;
      drawText(`[${chName}]`, LX + cxOff, CY + 9, 12, act ? '#ffe596' : '#9db3c2');
      addHit(LX + cxOff - 2, CY + 6, 44, 18, () => { state.colorChannel = chKey; render(); });
    }
    drawText('还原', LX + 214, CY + 9, 12, '#e0b253');
    addHit(LX + 210, CY + 6, 36, 18, () => {
      state.swordColors = { primary: 2, secondary: 0, accent: 1 };
      state.notice = '已还原剑纹默认配色';
      render();
    });
    for (let i = 0; i < CATALOG.colorPresets.length; i++) {
      const p = CATALOG.colorPresets[i];
      const wx = LX + 12 + i * 39, wy = CY + 26;
      const sel = state.swordColors[state.colorChannel] === i;
      ctx.fillStyle = sel ? '#ffe596' : '#0e121e';
      ctx.fillRect(wx, wy, 34, 16);
      ctx.fillStyle = `rgb(${p.rgb[0]},${p.rgb[1]},${p.rgb[2]})`;
      ctx.fillRect(wx + 2, wy + 2, 30, 12);
      const idx = i;
      addHit(wx, wy, 34, 16, () => {
        state.swordColors[state.colorChannel] = idx;
        state.notice = `已将剑【${state.colorChannel === 'primary' ? '主色' : (state.colorChannel === 'secondary' ? '副色' : '点缀')}】设为 ${p.name}`;
        render();
      });
    }
  } else {
    drawText(cls === 'bow' ? '弓矢固定原木/银枝/荆棘配色' : '星砂时钟固定蓝白星核与金环配色', LX + 12, CY + 11, 12, '#9db3c2');
    drawText('全局探索键：[E] 冻结  ·  [R] 回溯', LX + 12, CY + 28, 12, '#e0b253');
  }

  // =========================================================================
  // 右栏 (X=284, Y=54, W=340)
  // =========================================================================
  const RX = 284, RY = 54, RW = 340;

  // 4.1 右上卡：武器养成与进阶 (羊皮纸面板，高 166px)
  pbox(RX, RY, RW, 166, '#ecdaac', '#aa6630', '#0e121e', true);
  ctx.fillStyle = '#162230'; ctx.fillRect(RX + 8, RY + 8, RW - 16, 32);
  drawText(item.name, RX + 16, RY + 6, 24, '#ffe596');

  const curAtk = (item.attack * (1 + (dispLv - 1) * 0.10)).toFixed(1);
  const nxtAtk = dispLv < 5 ? (item.attack * (1 + dispLv * 0.10)).toFixed(1) : curAtk;
  const lvTag = !ownedLv ? '未打造 (打造后 Lv.1)' : (dispLv < 5 ? `Lv.${dispLv} → Lv.${dispLv+1}` : 'Lv.5 已满级');
  drawText(lvTag, RX + 132, RY + 18, 12, ownedLv ? '#70ce76' : '#6eb8f5');
  drawText(item.id === slot.equipped ? '当前装备' : (ownedLv ? '已拥有' : '待解锁'), RX + 268, RY + 18, 12, item.id === slot.equipped ? '#e0b253' : '#9db3c2');

  // 左属性盒：基础攻击（法器附带破坏半径）
  ctx.fillStyle = '#d8c292'; ctx.fillRect(RX + 12, RY + 45, 154, 36);
  ctx.strokeStyle = '#b69a6a'; ctx.lineWidth = 2; ctx.strokeRect(RX + 13, RY + 46, 152, 34);
  drawText(cls === 'time' ? '基础攻击 / 破坏半径' : '基础攻击', RX + 18, RY + 49, 12, '#3a2a18', 'left', 0, false);
  const atkStr = (ownedLv && dispLv < 5) ? `${curAtk} → ${nxtAtk} (+10%)` : `${curAtk} ${dispLv>=5 ? '(MAX)' : ''}`;
  drawText(atkStr, RX + 18, RY + 64, 12, '#1c762a', 'left', 0, false);

  // 右属性盒：固有副词条
  ctx.fillStyle = '#d8c292'; ctx.fillRect(RX + 174, RY + 45, 154, 36);
  ctx.strokeStyle = '#b69a6a'; ctx.lineWidth = 2; ctx.strokeRect(RX + 175, RY + 46, 152, 34);
  drawText('固有副词条', RX + 180, RY + 49, 12, '#3a2a18', 'left', 0, false);
  drawText(item.subLabel, RX + 180, RY + 64, 12, '#1c5694', 'left', 0, false);

  // 被动词条横条
  ctx.fillStyle = '#223444'; ctx.fillRect(RX + 12, RY + 86, RW - 24, 24);
  ctx.strokeStyle = '#0e121e'; ctx.lineWidth = 2; ctx.strokeRect(RX + 13, RY + 87, RW - 26, 22);
  drawText(`被动【${item.passiveName}】：${item.passiveDesc}`, RX + 18, RY + 92, 12, '#ffe596');

  // 智能上下文双按钮区 (RY+116, 高 40px)
  const nextWeapon = weapons[eqIdx + 1];
  if (ownedLv > 0) {
    // 按钮 1：如果未装备则显示【装备】，已装备则显示【强化升级】
    if (item.id !== slot.equipped) {
      pbox(RX + 12, RY + 116, 154, 40, '#aa6630', '#ffe596', '#0e121e', false);
      drawText(`装备 ${item.name}`, RX + 12, RY + 122, 12, '#ffe596', 'center', 154);
      drawText(`切换为当前主武器`, RX + 12, RY + 136, 12, '#ecdaac', 'center', 154);
      addHit(RX + 12, RY + 116, 154, 40, () => {
        slot.equipped = item.id;
        state.confirmSmelt = null;
        state.notice = `已装备【${item.name}】`;
        render();
      });
    } else {
      const canUp = dispLv < 5 && state.ore >= dispLv;
      pbox(RX + 12, RY + 116, 154, 40, canUp ? '#aa6630' : '#162230', canUp ? '#ffe596' : '#683a1c', '#0e121e', false);
      drawText(dispLv >= 5 ? '武器已达满级' : `强化升级 Lv.${dispLv+1}`, RX + 12, RY + 122, 12, canUp ? '#ffe596' : '#9db3c2', 'center', 154);
      drawText(dispLv >= 5 ? 'Lv.5 MAX' : `消耗 ${dispLv} 强化矿`, RX + 12, RY + 136, 12, '#ecdaac', 'center', 154);
      addHit(RX + 12, RY + 116, 154, 40, () => {
        if (dispLv >= 5) { state.notice = '武器已满级'; render(); return; }
        if (state.ore < dispLv) { state.notice = '强化矿不足（可点顶部按钮补充测试）'; render(); return; }
        state.ore -= dispLv;
        slot.levels[item.id] = dispLv + 1;
        state.notice = `【${item.name}】强化至 Lv.${dispLv+1}！基础攻击提升`;
        render();
      });
    }

    // 按钮 2：若存在下一阶武器，提供一键【熔铸进阶 -> 下一阶】；否则显示强化/已毕业
    if (item.id === slot.equipped && nextWeapon) {
      const targetOwned = slot.levels[nextWeapon.id] || 0;
      const cost = targetOwned ? 0 : CATALOG.craftCost[eqIdx + 1];
      const canSmelt = (!targetOwned || eqLv > targetOwned) && state.ore >= cost;
      const confirming = state.confirmSmelt === nextWeapon.id;
      pbox(RX + 174, RY + 116, 154, 40, confirming ? '#683a1c' : '#223444', confirming ? '#ffe596' : '#6eb8f5', '#0e121e', false);
      drawText(confirming ? `确认熔入 ${item.name}?` : `熔铸 → ${nextWeapon.name}`, RX + 174, RY + 122, 12, confirming ? '#ffe596' : '#6eb8f5', 'center', 154);
      drawText(`${cost > 0 ? cost + '矿' : '免矿'} · 继承 Lv.${eqLv}`, RX + 174, RY + 136, 12, '#ecdaac', 'center', 154);
      addHit(RX + 174, RY + 116, 154, 40, () => {
        if (!canSmelt) { state.notice = '强化矿不足或目标等级已高于当前武器'; render(); return; }
        if (!confirming) {
          state.confirmSmelt = nextWeapon.id;
          state.notice = `再次点击确认：消耗【${item.name}】，直达 Lv.${eqLv}【${nextWeapon.name}】`;
          render();
          return;
        }
        state.ore -= cost;
        slot.levels[nextWeapon.id] = eqLv;
        delete slot.levels[item.id];
        slot.equipped = nextWeapon.id;
        state.inspectId = nextWeapon.id;
        state.confirmSmelt = null;
        state.notice = `熔铸成功！【${nextWeapon.name}】已继承 Lv.${eqLv} 并自动装备`;
        render();
      });
    } else {
      const canUp = dispLv < 5 && state.ore >= dispLv;
      pbox(RX + 174, RY + 116, 154, 40, '#162230', '#683a1c', '#0e121e', false);
      drawText(cls === 'time' ? '唯一本命法器' : '传说阶毕业武器', RX + 174, RY + 122, 12, '#e0b253', 'center', 154);
      drawText('不可被熔铸消耗', RX + 174, RY + 136, 12, '#9db3c2', 'center', 154);
    }
  } else {
    // 当前查看的是尚未打造的武器：左【单独打造 Lv.1】 vs 右【从当前武器熔铸继承 Lv.X】
    const cost = CATALOG.craftCost[insIdx];
    const unlockedTier = insIdx <= eqIdx + 1;
    const canCraft = unlockedTier && state.ore >= cost;
    pbox(RX + 12, RY + 116, 154, 40, canCraft ? '#223444' : '#162230', canCraft ? '#e0b253' : '#683a1c', '#0e121e', false);
    drawText(unlockedTier ? `单独打造 ${item.name}` : '需先解锁上一阶', RX + 12, RY + 122, 12, canCraft ? '#ffe596' : '#9db3c2', 'center', 154);
    drawText(`${cost} 强化矿 · 新造 Lv.1`, RX + 12, RY + 136, 12, '#ecdaac', 'center', 154);
    addHit(RX + 12, RY + 116, 154, 40, () => {
      if (!unlockedTier) { state.notice = '请先打造或熔铸上一阶武器'; render(); return; }
      if (state.ore < cost) { state.notice = '强化矿不足'; render(); return; }
      state.ore -= cost;
      slot.levels[item.id] = 1;
      slot.equipped = item.id;
      state.confirmSmelt = null;
      state.notice = `已打造并装备 Lv.1【${item.name}】（原武器保留）`;
      render();
    });

    const isNextTier = insIdx === eqIdx + 1;
    const confirming = state.confirmSmelt === item.id;
    pbox(RX + 174, RY + 116, 154, 40, confirming ? '#683a1c' : (canCraft && isNextTier ? '#aa6630' : '#162230'), confirming ? '#ffe596' : '#6eb8f5', '#0e121e', false);
    drawText(confirming ? `确认消耗 ${eqItem.name}?` : `熔铸进阶 ${item.name}`, RX + 174, RY + 122, 12, '#ffe596', 'center', 154);
    drawText(`${cost}矿 · 继承 Lv.${eqLv}`, RX + 174, RY + 136, 12, '#ecdaac', 'center', 154);
    addHit(RX + 174, RY + 116, 154, 40, () => {
      if (!isNextTier) { state.notice = '只能将当前装备熔入同类下一阶武器'; render(); return; }
      if (state.ore < cost) { state.notice = '强化矿不足'; render(); return; }
      if (!confirming) {
        state.confirmSmelt = item.id;
        state.notice = `再次点击确认：将 Lv.${eqLv}【${eqItem.name}】熔铸为 Lv.${eqLv}【${item.name}】`;
        render();
        return;
      }
      state.ore -= cost;
      slot.levels[item.id] = eqLv;
      delete slot.levels[eqItem.id];
      slot.equipped = item.id;
      state.confirmSmelt = null;
      state.notice = `熔铸成功！【${item.name}】已继承 Lv.${eqLv}`;
      render();
    });
  }

  // =========================================================================
  // 4.2 右下卡：专属时印装配与垫刀精炼 (Y=228, H=118)
  // =========================================================================
  const IY = RY + 174;
  pbox(RX, IY, RW, 118, '#121a26', '#966828', '#0e121e', true);
  const imprints = CATALOG.imprints[cls];
  const activeSeal = imprints.find(s => s.id === slot.imprint) || imprints[0];
  const rank = slot.ranks[activeSeal.id] || 1;
  const fails = slot.failures[activeSeal.id] || 0;
  const roman = ['I', 'II', 'III'][rank - 1];
  const chance = rank < 3 ? CATALOG.refineChance[rank][fails] : 100;

  drawText(`${cls === 'sword' ? '剑印' : (cls === 'bow' ? '矢印' : '法印')}装配（换同类武器自动继承）`, RX + 14, IY + 10, 12, '#e0b253');
  const chanceTxt = rank >= 3 ? '已达最高 III 阶' : `成功率 ${chance}%${fails > 0 ? ' · 已垫' + fails + '次' : ''}`;
  drawText(chanceTxt.replace('垫', '保底'), RX + 198, IY + 10, 12, '#70ce76');

  for (let i = 0; i < imprints.length; i++) {
    const s = imprints[i];
    const sRank = slot.ranks[s.id] || 1;
    const sRoman = ['I', 'II', 'III'][sRank - 1];
    const isAct = s.id === activeSeal.id;
    const wBox = imprints.length === 2 ? 154 : 102;
    const gap = imprints.length === 2 ? 160 : 106;
    const kx = RX + 12 + i * gap, ky = IY + 26;
    pbox(kx, ky, wBox, 44, isAct ? '#223444' : '#162230', isAct ? '#ffe596' : '#683a1c', '#0e121e', false);
    drawImg2x(`imp_${s.id}_20`, kx + 6, ky + 2);
    drawText(`${s.name}·${sRoman}`, kx + 46, ky + 9, 12, isAct ? '#ffe596' : '#ecdaac');
    drawText(`${s.label}+${s.bonus * sRank}%`, kx + 46, ky + 23, 12, isAct ? '#70ce76' : '#9db3c2');
    addHit(kx, ky, wBox, 44, () => {
      slot.imprint = s.id;
      state.notice = `已装配【${s.fullName} · ${sRoman}阶】（${s.label} +${s.bonus * sRank}%）`;
      render();
    });
  }

  // 精炼 vs 稳炼双按钮
  const nextRoman = rank < 3 ? ['I', 'II', 'III'][rank] : 'III';
  const canRef = rank < 3 && state.sand >= 1;
  pbox(RX + 12, IY + 74, 154, 34, canRef ? '#683a1c' : '#162230', canRef ? '#e0b253' : '#344c5e', '#0e121e', false);
  drawText(rank >= 3 ? '时印已至最高阶' : `精炼 ${roman}→${nextRoman} · 1砂 (${chance}%)`, RX + 12, IY + 85, 12, canRef ? '#ffe596' : '#9db3c2', 'center', 154);
  addHit(RX + 12, IY + 74, 154, 34, () => {
    if (rank >= 3) { state.notice = '该时印已达最高 III 阶'; render(); return; }
    if (state.sand < 1) { state.notice = '淬炼砂不足'; render(); return; }
    state.sand -= 1;
    const roll = Math.random() * 100;
    if (chance >= 100 || roll <= chance) {
      slot.ranks[activeSeal.id] = rank + 1;
      slot.failures[activeSeal.id] = 0;
      state.notice = `精炼成功！【${activeSeal.fullName}】升至 ${nextRoman} 阶（${activeSeal.label} +${activeSeal.bonus * (rank+1)}%）`;
    } else {
      slot.failures[activeSeal.id] = fails + 1;
      const nextChance = CATALOG.refineChance[rank][fails + 1];
      state.notice = `精炼未成，炉火保底提升！下次成功率升至 ${nextChance}%`;
    }
    render();
  });

  const canGuar = rank < 3 && chance < 100 && state.sand >= 2;
  pbox(RX + 174, IY + 74, 154, 34, canGuar ? '#223444' : '#162230', canGuar ? '#6eb8f5' : '#344c5e', '#0e121e', false);
  drawText(rank >= 3 ? 'III 阶 MAX' : (chance >= 100 ? '已触发100%保底(点左键)' : `稳炼 ${roman}→${nextRoman} · 2砂 (必成)`), RX + 174, IY + 85, 12, canGuar ? '#6eb8f5' : '#9db3c2', 'center', 154);
  addHit(RX + 174, IY + 74, 154, 34, () => {
    if (rank >= 3 || chance >= 100) return;
    if (state.sand < 2) { state.notice = '淬炼砂不足（稳炼需 2 砂）'; render(); return; }
    state.sand -= 2;
    slot.ranks[activeSeal.id] = rank + 1;
    slot.failures[activeSeal.id] = 0;
    state.notice = `稳炼成功！【${activeSeal.fullName}】直达 ${nextRoman} 阶（${activeSeal.label} +${activeSeal.bonus * (rank+1)}%）`;
    render();
  });

  document.getElementById('status-bar').textContent = state.notice;
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (640 / rect.width);
  const y = (e.clientY - rect.top) * (360 / rect.height);
  for (let i = hitBoxes.length - 1; i >= 0; i--) {
    const b = hitBoxes[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      b.fn();
      return;
    }
  }
});

async function boot() {
  await document.fonts.ready;
  const entries = Object.entries(ASSETS_B64);
  await Promise.all(entries.map(([k, src]) => new Promise((res) => {
    const im = new Image();
    im.onload = () => { IMAGES[k] = im; res(); };
    im.onerror = () => res();
    im.src = src;
  })));
  fitCanvas();
  resetSave();
}
boot();
</script>
</body>
